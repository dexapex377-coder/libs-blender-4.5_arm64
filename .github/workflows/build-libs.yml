name: Build Third-Party Libraries for Blender 4.5 Android ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: "r26d"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
  ANDROID_API: "24"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Tier 1: Core libs (no dependencies on other prebuilt libs)
  # ═══════════════════════════════════════════════════════════════
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lib:
          - zlib
          - zstd
          - BZip2
          - Expat
          - JPEG
          - Png
          - TIFF
          - sqlite
          - zip
          - blosc
          - IMath
          - Brotli
          - FreeType
          - Potrace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Download NDK
        run: |
          if [ ! -d "$HOME/android-ndk-r26d" ]; then
            wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME/"
            rm /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"

      - name: Build ${{ matrix.lib }}
        run: |
          bash repo/scripts/build-${{ matrix.lib }}.sh \
            "$HOME/android-ndk-r26d" \
            "$HOME/libs" \
            "$HOME/build/${{ matrix.lib }}" \
            "${{ env.ANDROID_API }}"

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: tier1-${{ matrix.lib }}
          path: |
            ~/libs/lib/
            ~/libs/include/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Tier 2: Libs that depend only on Tier 1
  # ═══════════════════════════════════════════════════════════════
  tier2:
    needs: tier1
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lib:
          - Tbb
          - Harfbuzz
          - PugiXML
          - YAML
          - GMP
          - Fftw
          - OpenJPEG
          - WebP
          - Haru
          - Manifold
          - JeMalloc
          - OpenBlas
          - Boost
          - Openpgl  # optional, may fail
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Download NDK
        run: |
          if [ ! -d "$HOME/android-ndk-r26d" ]; then
            wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME/"
            rm /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"

      - name: Download Tier 1 libs
        uses: actions/download-artifact@v4
        with:
          path: all-tier1
          pattern: tier1-*
          merge-multiple: true

      - name: Merge Tier 1 libs
        run: |
          mkdir -p ~/libs/lib ~/libs/include
          cp -rn all-tier1/lib/* ~/libs/lib/ 2>/dev/null || true
          cp -rn all-tier1/include/* ~/libs/include/ 2>/dev/null || true
          echo "Tier 1 libs:"
          find ~/libs/lib -name "*.so" -o -name "*.a" | wc -l

      - name: Build ${{ matrix.lib }}
        run: |
          export CMAKE_PREFIX_PATH="$HOME/libs"
          export PKG_CONFIG_PATH="$HOME/libs/lib/pkgconfig:$HOME/libs/lib64/pkgconfig"
          bash repo/scripts/build-${{ matrix.lib }}.sh \
            "$HOME/android-ndk-r26d" \
            "$HOME/libs" \
            "$HOME/build/${{ matrix.lib }}" \
            "${{ env.ANDROID_API }}"

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: tier2-${{ matrix.lib }}
          path: |
            ~/libs/lib/
            ~/libs/include/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Tier 3: Libs that depend on Tier 1 + Tier 2
  # ═══════════════════════════════════════════════════════════════
  tier3:
    needs: [tier1, tier2]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lib:
          - OpenEXR
          - Embree
          - Oidn
          - OpenSubdiv
          - Epoxy
          - OpenAL
          - ffmpeg
          - SndFile
          - SDL
          - LibXML
          - OpenCOLLADA
          - Alembic
          - Fribidi
          - ICUC
          - ShaderC
          - MaterialX
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Download NDK
        run: |
          if [ ! -d "$HOME/android-ndk-r26d" ]; then
            wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME/"
            rm /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"

      - name: Download all previous tier libs
        uses: actions/download-artifact@v4
        with:
          path: all-prev-libs
          pattern: tier*-*
          merge-multiple: true

      - name: Merge all previous tier libs
        run: |
          mkdir -p ~/libs/lib ~/libs/include
          cp -rn all-prev-libs/lib/* ~/libs/lib/ 2>/dev/null || true
          cp -rn all-prev-libs/include/* ~/libs/include/ 2>/dev/null || true
          echo "All libs so far:"
          find ~/libs/lib -name "*.so" -o -name "*.a" | wc -l

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcre2-dev meson ninja-build

      - name: Build ${{ matrix.lib }}
        run: |
          export CMAKE_PREFIX_PATH="$HOME/libs"
          export PKG_CONFIG_PATH="$HOME/libs/lib/pkgconfig:$HOME/libs/lib64/pkgconfig"
          bash repo/scripts/build-${{ matrix.lib }}.sh \
            "$HOME/android-ndk-r26d" \
            "$HOME/libs" \
            "$HOME/build/${{ matrix.lib }}" \
            "${{ env.ANDROID_API }}"

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: tier3-${{ matrix.lib }}
          path: |
            ~/libs/lib/
            ~/libs/include/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Tier 4: Libs that need Boost (tier2) or OpenEXR (tier3)
  # ═══════════════════════════════════════════════════════════════
  tier4:
    needs: [tier1, tier2, tier3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lib:
          - OpenVDB
          - OpenImageIO
          - OpenColorIO
          - OpenUSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Download NDK
        run: |
          if [ ! -d "$HOME/android-ndk-r26d" ]; then
            wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME/"
            rm /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r26d" >> $GITHUB_ENV
          # Fix nanosleep/tm bug in NDK r26d libc++ headers
          sed -i 's|CMAKE_CXX_FLAGS_INIT ""|CMAKE_CXX_FLAGS_INIT "-include time.h"|' \
            "$HOME/android-ndk-r26d/build/cmake/android.toolchain.cmake"

      - name: Download all previous tier libs
        uses: actions/download-artifact@v4
        with:
          path: all-prev-libs
          pattern: tier*-*
          merge-multiple: true

      - name: Merge all previous tier libs
        run: |
          mkdir -p ~/libs/lib ~/libs/include
          cp -rn all-prev-libs/lib/* ~/libs/lib/ 2>/dev/null || true
          cp -rn all-prev-libs/include/* ~/libs/include/ 2>/dev/null || true
          echo "All libs so far:"
          find ~/libs/lib -name "*.so" -o -name "*.a" | wc -l

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build python3-pip autoconf libtool automake pkg-config cmake

      - name: Build ${{ matrix.lib }}
        run: |
          export CMAKE_PREFIX_PATH="$HOME/libs"
          export PKG_CONFIG_PATH="$HOME/libs/lib/pkgconfig:$HOME/libs/lib64/pkgconfig"
          bash repo/scripts/build-${{ matrix.lib }}.sh \
            "$HOME/android-ndk-r26d" \
            "$HOME/libs" \
            "$HOME/build/${{ matrix.lib }}" \
            "${{ env.ANDROID_API }}"

      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: tier4-${{ matrix.lib }}
          path: |
            ~/libs/lib/
            ~/libs/include/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Collect: merge all tiers into final artifact
  # ═══════════════════════════════════════════════════════════════
  collect:
    needs: [tier1, tier2, tier3, tier4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-libs
          pattern: tier*-*
          merge-multiple: true

      - name: Merge and package
        run: |
          mkdir -p final-libs/lib final-libs/include
          cp -rn all-libs/lib/* final-libs/lib/ 2>/dev/null || true
          cp -rn all-libs/include/* final-libs/include/ 2>/dev/null || true

          echo "=== Final library count ==="
          SO=$(find final-libs/lib -name "*.so" | wc -l)
          A=$(find final-libs/lib -name "*.a" | wc -l)
          echo "Shared: $SO, Static: $A"

          echo "=== Final header dirs ==="
          ls final-libs/include/

          echo "=== Size per lib ==="
          for dir in final-libs/lib/*/; do
            libname=$(basename "$dir")
            size=$(du -sh "$dir" | cut -f1)
            echo "  $libname: $size"
          done

          cd final-libs
          tar czf ${{ github.workspace }}/libs-blender-4.5-arm64.tar.gz lib/ include/

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: libs-blender-4.5-arm64
          path: ${{ github.workspace }}/libs-blender-4.5-arm64.tar.gz
          retention-days: 30
